<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iconizer</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 1.5rem; }
      .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: center; margin: 1rem 0; }
      .controls label { display: flex; gap: 0.4rem; align-items: center; }
      #out { margin-top: 1rem; max-width: 100%; }
      #out svg { max-width: 100%; height: auto; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <h1>iconizer</h1>
    <div class="controls">
      <label>image <input id="image" type="file" accept="image/*" /></label>
      <label>icon SVG <input id="svg" type="file" accept=".svg,image/svg+xml" /></label>
    </div>
    <div class="controls">
      <label>cols <input id="cols" type="range" min="4" max="120" value="32" /><span id="colsVal">32</span></label>
      <label>background <input id="background" type="color" value="#ffffff" /></label>
      <label>tint
        <select id="tintMode">
          <option value="fill">fill — single-color / currentColor icons</option>
          <option value="filter">filter — any SVG, approximate color</option>
        </select>
      </label>
      <label><input id="sizeByBrightness" type="checkbox" /> size by brightness</label>
      <label>min <input id="sizeMin" type="range" min="0" max="1" step="0.05" value="0.3" /></label>
      <label>max <input id="sizeMax" type="range" min="0" max="1" step="0.05" value="1" /></label>
    </div>
    <div id="out"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
