<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iconizer</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 1.5rem; }
      .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: center; margin: 1rem 0; }
      .controls label { display: flex; gap: 0.4rem; align-items: center; }
      #out { margin-top: 1rem; max-width: 100%; }
      #out svg { max-width: 100%; height: auto; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <h1>iconizer</h1>
    <div class="controls">
      <label>image <input id="image" type="file" accept="image/*" /></label>
      <label>icon SVG <input id="svg" type="file" accept=".svg,image/svg+xml" /></label>
    </div>
    <div class="controls">
      <label>cols <input id="cols" type="range" min="4" max="120" value="32" /><span id="colsVal">32</span></label>
      <label>block <input id="blockSize" type="range" min="1" max="8" step="1" value="1" /><span id="blockVal">1×1</span></label>
      <label>icon size <input id="iconScale" type="range" min="0.2" max="3" step="0.1" value="1" /><span id="iconScaleVal">1</span>x</label>
      <label>background <input id="background" type="color" value="#ffffff" /></label>
      <label><input id="sizeByBrightness" type="checkbox" /> size by brightness</label>
      <label>min <input id="sizeMin" type="range" min="0" max="1" step="0.05" value="0.3" /></label>
      <label>max <input id="sizeMax" type="range" min="0" max="1" step="0.05" value="1" /></label>
    </div>
    <div class="controls">
      <label><input id="layered" type="checkbox" /> layered (CMY)</label>
      <label>layers
        <select id="layerCount">
          <option value="3">3 — CMY</option>
          <option value="2">2 — CM</option>
        </select>
      </label>
      <label>offset <input id="layerOffset" type="range" min="0" max="6" step="0.5" value="0" /></label>
    </div>
    <div class="controls">
      <label>scheme
        <select id="scheme">
          <option value="none">none</option>
          <option value="grayscale">grayscale</option>
          <option value="invert">invert</option>
          <option value="posterize">posterize</option>
          <option value="duotone">duotone</option>
          <option value="palette">palette</option>
        </select>
      </label>
      <label id="p-levels" hidden>levels <input id="levels" type="range" min="2" max="8" step="1" value="4" /></label>
      <label id="p-duotone" hidden>dark <input id="duoDark" type="color" value="#1a0033" /> light <input id="duoLight" type="color" value="#1ed760" /></label>
      <span id="p-palette" hidden>palette
        <input id="pal0" type="color" value="#ff0000" />
        <input id="pal1" type="color" value="#00ff00" />
        <input id="pal2" type="color" value="#0000ff" />
      </span>
    </div>
    <div class="controls">
      <label>motion
        <select id="motion">
          <option value="none">none</option>
          <option value="wiggle">wiggle</option>
          <option value="swing">swing</option>
          <option value="spin">spin</option>
          <option value="pulse">pulse</option>
          <option value="bob">bob</option>
          <option value="shimmer">shimmer</option>
        </select>
      </label>
      <label>speed <input id="motionSpeed" type="range" min="0.3" max="4" step="0.1" value="1.5" /></label>
      <label>stagger
        <select id="staggerMode">
          <option value="ripple">ripple</option>
          <option value="none">none</option>
          <option value="brightness">brightness</option>
          <option value="random">random</option>
        </select>
      </label>
    </div>
    <div class="controls">
      <button id="dlSvg" type="button" disabled>Download SVG</button>
      <button id="dlPng" type="button" disabled>Download PNG</button>
      <label>scale
        <select id="scale">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </label>
    </div>
    <div id="out"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
